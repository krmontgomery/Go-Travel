<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="travel_recommendation.css">
    <title>Go Travel - Contact</title>
</head>
<body>
    <nav><h1>Go Travel!</h1>
        <ul>
            <li><a href="./travel_recommendation.html" id="home">Home</a></li>
            <li><a href="./about.html" id="about">About Us</a></li>
            <li><a href="./contact.html" id="contact">Contact Us</a></li>
        </ul>
    </nav>
    <div id="contactContent">
        <div id="socials">
                <ul>
                    <li><a href="#" title="instagram icon"><img class="socialIcons" src="Images/instagram.png" alt="Instagram"></a></li>
                    <li><a href="#" title="facebook icon"><img class="socialIcons" src="Images/facebook.png" alt="Facebook"></a></li>
                </ul>
            </div>
        <div id="contactContainer">
            <h2>CONTACT US</h2>
    
            <form id="contactForm">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name">
    
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
    
                <label for="message">Message</label>
                <textarea id="message" placeholder="Enter your message"></textarea>
    
                <button type="submit" id="submitBtn">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
